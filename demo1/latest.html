<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Opening the latest YeahPromos demo…</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111111;
        background: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(420px, 100%);
        border: 1px solid #d1d5db;
        padding: 28px;
        background: #ffffff;
      }

      .brand {
        margin: 0 0 24px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      .brand b {
        color: #e60000;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.55;
      }

      .progress {
        width: 100%;
        height: 3px;
        margin-top: 22px;
        overflow: hidden;
        background: #fde8e8;
      }

      .progress::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        background: #e60000;
        animation: load 1.1s ease-in-out infinite alternate;
      }

      a {
        color: #cd0200;
        font-weight: 650;
      }

      @keyframes load {
        from { transform: translateX(-100%); }
        to { transform: translateX(240%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="latest-preview-title">
      <div class="brand" aria-label="YeahPromos">YEAH<b>P</b>ROMOS</div>
      <h1 id="latest-preview-title">Opening the latest Demo 1</h1>
      <p role="status">Resolving the current <code>main</code> commit to avoid stale branch caching.</p>
      <div class="progress" aria-hidden="true"></div>
      <noscript>
        <p>
          JavaScript is required to resolve the latest commit.
          <a href="https://raw.githack.com/Yeahpromos/YeahPromos-Brand/d6673633b1805fd81093a1e0dc83f36dc5bb0eb2/demo1/index.html">Open the verified version</a>.
        </p>
      </noscript>
    </main>

    <script>
      const repository = 'Yeahpromos/YeahPromos-Brand';
      const fallbackCommit = 'd6673633b1805fd81093a1e0dc83f36dc5bb0eb2';
      const commitPattern = /^[0-9a-f]{40}$/i;

      const openCommit = (commit) => {
        window.location.replace(`https://raw.githack.com/${repository}/${commit}/demo1/index.html`);
      };

      fetch(`https://api.github.com/repos/${repository}/commits/main`, {
        cache: 'no-store',
        headers: { Accept: 'application/vnd.github+json' },
      })
        .then((response) => {
          if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
          return response.json();
        })
        .then(({ sha }) => openCommit(commitPattern.test(sha) ? sha : fallbackCommit))
        .catch(() => openCommit(fallbackCommit));
    </script>
  </body>
</html>
